.me{font-size:15px;color:#A898A6;text-align:center;min-height:20px}
.fly{position:fixed;width:44px;height:44px;pointer-events:none;animation:fly 1s ease-out forwards}

.done #btn{display:none}.done .card video{filter:none;transform:none}

 document.getElementById('me').textContent='Ai dat '+mine+' like-uri';
 var h=document.createElement('img');h.className='fly';h.src=this.firstElementChild.src;h.style.left=(e.clientX-22)+'px';h.style.top=(e.clientY-22)+'px';
